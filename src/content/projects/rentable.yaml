summary:
  en: "An offline-first desktop tracker for rent payments. A Tauri 2 shell in Rust around a SvelteKit 2 and Svelte 5 frontend keeps a local replica of a Turso database and syncs when there is a network; a separate control plane handles accounts, workspaces, and sync tokens over plain JSON."
  ar: "متتبع لمدفوعات الإيجار على سطح المكتب يعمل دون اتصال أولاً. غلاف Tauri 2 بلغة Rust حول واجهة SvelteKit 2 وSvelte 5 يحتفظ بنسخة محلية من قاعدة بيانات Turso ويزامنها عند توفر الشبكة؛ ومستوى تحكم منفصل يتولى الحسابات ومساحات العمل ورموز المزامنة عبر JSON بسيط."
