name: '🏷️ labeler'

on:
  pull_request_target:
    branches: ['*']

  # added for `effort-status` below. `on:` is the file's, not a job's, so both
  # labelling jobs carry an `if:` restricting them to the trigger they were
  # written for. without it they would also run on close — and under
  # `pull_request` rather than `pull_request_target`, where a fork's token is
  # read-only and every label write fails.
  pull_request:
    types: ['closed']

jobs:
  file-based-labeler:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
          configuration-path: .github/labeler.yml

  # Every type the title lint in pull-request-title.yml accepts maps to exactly
  # one label here. A type missing from this list passes the lint and then
  # produces no label at all, which is the failure the list exists to prevent.
  # `📦 flag: dependencies` is deliberately absent: .github/labeler.yml owns it,
  # because a lockfile path is harder evidence than a title convention.
  pr-title-labeler:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: mauroalderete/action-assign-labels@v1
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          maintain-labels-not-matched: false
          apply-changes: true
          conventional-commits: |
            conventional-commits:
              - type: 'fix'
                nouns: ['fix']
                labels: ['🐞 type: bug']

              - type: 'feature'
                nouns: ['feat']
                labels: ['✨ type: enhancement']

              - type: 'performance'
                nouns: ['perf']
                labels: ['✨ type: enhancement']

              - type: 'documentation'
                nouns: ['docs']
                labels: ['📚 type: documentation']

              - type: 'refactoring'
                nouns: ['refactor']
                labels: ['✨ type: enhancement']

              - type: 'continuous_integration'
                nouns: ['ci']
                labels: ['🔧 type: tools']

              - type: 'testing'
                nouns: ['test']
                labels: ['🧪 type: tests']

              - type: 'build'
                nouns: ['build']
                labels: ['🏗️ type: build']

              - type: 'chore'
                nouns: ['chore', 'style', 'revert']
                labels: ['🧹 type: chore']

              - type: 'breaking_change'
                nouns: ['BREAKING CHANGE', '!']
                labels: ['💥 flag: breaking changes']

  effort-status:
    name: move status to its terminal value
    # The guard travels with the job, and this is why it is here rather than
    # left to `on:` above. `on:` is the file's rather than the job's, so this
    # job added to a workflow that already triggers on something else would run
    # on that trigger too, and label change requests that are still open. This
    # keeps it to a change request that actually closed, wherever it lands.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      # The vocabulary is this repository's rather than this job's. These carry
      # the emoji because the label names do: a value without it does not match
      # an existing label, and the REST call creates a duplicate rather than
      # failing. Check against `gh label list --limit 200` before editing.
      TERMINAL_LABEL: '✔️ status: done'
      IN_REVIEW_LABEL: '👀 status: in review'
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The guard, and the thing to read before deleting either branch of it.
      # `closed` fires whether or not a merge happened, so whether one did is
      # read rather than assumed. Both branches reach the same terminal label on
      # purpose: an effort abandoned is over too, and leaving it sitting at the
      # in-review value is the drift this file exists to remove.
      - name: The change request merged
        if: github.event.pull_request.merged == true
        run: echo "merged. Moving to $TERMINAL_LABEL" >> "$GITHUB_STEP_SUMMARY"

      - name: The change request closed without merging
        if: github.event.pull_request.merged != true
        run: echo "closed without merging. Moving to $TERMINAL_LABEL as well" >> "$GITHUB_STEP_SUMMARY"

      - name: Move the change request
        run: |
          gh pr edit "$NUMBER" --repo "$REPO" \
            --add-label "$TERMINAL_LABEL" --remove-label "$IN_REVIEW_LABEL"

      - name: Move every issue it closes
        run: |
          # `closingIssuesReferences` resolves the linked issue from the change
          # request itself, so nothing here reads a body looking for a keyword.
          # An empty result means this change request closed no issue, which is
          # an ordinary outcome rather than a failure.
          issues=$(gh pr view "$NUMBER" --repo "$REPO" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')
          for issue in $issues; do
            gh issue edit "$issue" --repo "$REPO" \
              --add-label "$TERMINAL_LABEL" --remove-label "$IN_REVIEW_LABEL"
          done
